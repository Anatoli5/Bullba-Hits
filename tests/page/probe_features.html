function webgl(){
  var out={};var c=document.getElementById('c');var gl=null;
  try{gl=c.getContext('webgl2',{antialias:false});}catch(e){out.error=err(e);}
  out.webgl2=!!gl;

  out.renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);

  out.EXT_float_blend=!!gl.getExtension('EXT_float_blend');
  // Render into an RGBA32F target and read the float back: the capability the armour screen relies on.
  try{

    var fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);

    if(out.rgba32fComplete){gl.viewport(0,0,4,4);gl.clearBufferfv(gl.COLOR,0,new Float32Array([1.5,-2.25,1e6,0.125]));

function offscreen(){
  var out={};

function workerTest(make,label){
  return new Promise(function(resolve){
    var w;try{w=make();}catch(e){resolve({construct:err(e)});return;}
    var done=false;function fin(v){if(done)return;done=true;try{w.terminate();}catch(e){}resolve(v);}
    w.onmessage=function(ev){fin({ok:true,reply:ev.data});};
    w.onerror=function(ev){ev.preventDefault&&ev.preventDefault();fin({errorEvent:ev.message||'error event (no message)'});};
    w.onmessageerror=function(){fin({messageerror:true});};
    try{w.postMessage({ping:1});}catch(e){fin({postMessage:err(e)});}
    setTimeout(function(){fin({timeout:true});},4000);
  });
}

  "wasm:typeof WebAssembly,offscreen:typeof OffscreenCanvas,sab:typeof SharedArrayBuffer};"+
  "try{r.offscreenWebgl2=!!new OffscreenCanvas(4,4).getContext('webgl2');}catch(x){r.offscreenWebgl2=String(x);}"+
  "if(e.data&&e.data.module){try{r.moduleInstantiated=!!new WebAssembly.Instance(e.data.module);}catch(x){r.moduleInstantiated=String(x);}}"+
  "if(e.data&&e.data.buffer){r.bufferBytes=e.data.buffer.byteLength;}"+
  "if(e.data&&e.data.importBlob){try{importScripts(e.data.importBlob);r.importScriptsBlob=self.__probeImported===1?'ok':'ran?';}catch(x){r.importScriptsBlob=String(x);}}"+
  "if(e.data&&e.data.importFile){try{importScripts(e.data.importFile);r.importScriptsFile='ok';}catch(x){r.importScriptsFile=String(x);}}"+
  "if(e.data&&e.data.shared){r.sharedBufferType=Object.prototype.toString.call(e.data.shared.buffer);}"+
  "try{importScripts;r.importScripts=typeof importScripts;}catch(x){r.importScripts='absent';}"+
  "postMessage(r);};";
function workers(){
  var out={};var jobs=[];
  function add(k,f){jobs.push(workerTest(f,k).then(function(v){out[k]=v;}));}
  add('classicFileUrl',function(){return new Worker('probe_features_worker.js');});
  add('moduleFileUrl',function(){return new Worker('probe_features_worker.js',{type:'module'});});
  add('classicBlob',function(){return new Worker(URL.createObjectURL(new Blob([WORKER_BODY],{type:'text/javascript'})));});
  add('moduleBlob',function(){return new Worker(URL.createObjectURL(new Blob([WORKER_BODY],{type:'text/javascript'})),{type:'module'});});
  add('classicDataUrl',function(){return new Worker('data:text/javascript,'+encodeURIComponent(WORKER_BODY));});
  return Promise.all(jobs).then(function(){
    // A compiled WebAssembly.Module and a transferred ArrayBuffer sent to a blob worker.
    return workerTest(function(){
      var w=new Worker(URL.createObjectURL(new Blob([WORKER_BODY],{type:'text/javascript'})));
      var mod=new WebAssembly.Module(bytes([0,97,115,109,1,0,0,0]));var buf=new ArrayBuffer(1<<20);

    }).then(function(v){out.blobWithModuleAndTransfer=v;});

    return workerTest(function(){
      var w=new Worker(URL.createObjectURL(new Blob([WORKER_BODY],{type:'text/javascript'})));
      var lib=URL.createObjectURL(new Blob(['self.__probeImported=1;'],{type:'text/javascript'}));

    }).then(function(v){out.importScriptsInBlobWorker=v;});
  }).then(function(){
    // Shared wasm memory posted to a worker: works only where the page may share memory across agents.
    return workerTest(function(){
      var w=new Worker(URL.createObjectURL(new Blob([WORKER_BODY],{type:'text/javascript'})));
      var sm=new WebAssembly.Memory({initial:1,maximum:1,shared:true});var post=w.postMessage.bind(w);w.postMessage=function(){post({shared:sm});};return w;

function timing(){
  var out={};
  // performance.now granularity: smallest non-zero step seen over ~20 ms of busy polling.
  var t0=performance.now(),prev=t0,min=Infinity,steps=0;while(performance.now()-t0<20){var t=performance.now();if(t!==prev){min=Math.min(min,t-prev);prev=t;steps++;}}
  out.performanceNowMinStepMs=min;out.performanceNowSteps=steps;

  // requestAnimationFrame: 180 frames, intervals between rAF timestamps and between performance.now at callback.
  var ts=[],now=[];
  return new Promise(function(resolve){
    function tick(t){ts.push(t);now.push(performance.now());if(ts.length<181)requestAnimationFrame(tick);else resolve();}
    requestAnimationFrame(tick);setTimeout(resolve,8000);

    function stats(a){var d=[];for(var i=1;i<a.length;i++)d.push(a[i]-a[i-1]);d.sort(function(x,y){return x-y;});
      if(!d.length)return null;return {n:d.length,min:+d[0].toFixed(3),median:+d[d.length>>1].toFixed(3),p90:+d[Math.floor(d.length*.9)].toFixed(3),max:+d[d.length-1].toFixed(3)};}
    out.rafTimestampIntervals=stats(ts);out.rafCallbackIntervals=stats(now);

    if(ts.length>2){var g=1000/60,off=0;for(var i=1;i<ts.length;i++){var q=(ts[i]-ts[0])/g;off=Math.max(off,Math.abs(q-Math.round(q)));}out.rafOn60HzGridMaxErrorFrames=+off.toFixed(4);}
    R.timing=out;log('timing');

}
